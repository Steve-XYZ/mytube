appId: com.mytube.app
productName: MyTube
copyright: Copyright 2026

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

# Binaries are staged per platform/arch in bin/<os>/<arch>/ so a single build host
# can produce correct packages for every target. extraResources is defined per
# platform below (electron-builder replaces, not merges, arrays for a platform).
# The PO-token provider lives in bin/shared/ (platform-independent) and is copied
# alongside the per-arch binaries. afterPack verifies the result and fails the
# build if a required binary is missing or has the wrong architecture.
afterPack: ./scripts/verify-binaries.cjs

asar: true
compression: maximum

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extraResources:
    - from: bin/mac/${arch}/
      to: bin/
      filter:
        - yt-dlp
        - ffmpeg
        - ffprobe
    - &shared_resources
      from: bin/shared/
      to: bin/
      filter:
        - bgutil-ytdlp-pot-provider/server/build/**/*
        - bgutil-ytdlp-pot-provider/server/package.json
        - bgutil-ytdlp-pot-provider/server/node_modules/**/*
        - yt-dlp-plugins/bgutil-ytdlp-pot-provider/yt_dlp_plugins/**/*.py
        - "!**/.git{,/**/*}"
        - "!**/.cache{,/**/*}"
        - "!**/{test,tests,__tests__}{,/**/*}"
        - "!bgutil-ytdlp-pot-provider/server/build/**/*.map"

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  extraResources:
    - from: bin/win/${arch}/
      to: bin/
      filter:
        - yt-dlp.exe
        - ffmpeg.exe
        - ffprobe.exe
    - *shared_resources

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MyTube
  uninstallDisplayName: MyTube

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Network
  icon: build/icons
  extraResources:
    - from: bin/linux/${arch}/
      to: bin/
      filter:
        - yt-dlp
        - ffmpeg
        - ffprobe
    - *shared_resources

# Auto-update metadata (latest-mac.yml / app-update.yml) is only generated when a
# valid publish target is set. An empty `owner` made electron-builder crash during
# update-info generation (computeChannelNames), so publishing is left unconfigured
# here — `pnpm dist:*` now produces a clean installer. To enable GitHub auto-updates,
# fill in a real owner and uncomment:
#
# publish:
#   provider: github
#   owner: your-github-username
#   repo: mytube
#   releaseType: release
